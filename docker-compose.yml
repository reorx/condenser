# Run from the condenser/ directory: `docker compose up --build`
# telememo is installed from PyPI during the build, so the context is just this dir.
services:
  condenser:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    ports:
      - "8792:8792"
    volumes:
      - condenser-data:/data
    restart: unless-stopped

volumes:
  condenser-data:
