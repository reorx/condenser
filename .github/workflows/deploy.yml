name: Build and Deploy

# CD restored 2026-07-19 via hookploy: push -> build -> POST /hooks/condenser
# with the image digest; the hookploy edge on hh-hk-01 pins + recreates.
# 202 = accepted (async); check `hookploy deploys condenser` for the result.
on:
  push:
    branches: [master]
    # Build only when something the image actually consumes changed. The list
    # mirrors the Dockerfile's COPY lines (condenser/, frontend/, pyproject +
    # uv.lock) plus the build inputs themselves. Everything else in the repo —
    # kb/, ios/, probe/, tests/, scripts/, root *.md, docker-compose.yml — never
    # reaches the image, so a push touching only those must not rebuild + redeploy
    # (before 2026-09-07 roughly half of all pushes were docs/iOS-only and still
    # produced a full build + production restart). Keep in sync with .dockerignore.
    #
    # A path added to the Dockerfile must be added here too, or a change to it
    # will silently not deploy. When in doubt, use "Run workflow" (workflow_dispatch).
    paths:
      - 'condenser/**'
      - 'frontend/**'
      # Frontend files that pnpm build never reads: vitest tests + setup
      # (tsconfig.app.json excludes them from tsc -b), the dev-only component
      # preview playground, and docs.
      - '!frontend/**/*.test.ts'
      - '!frontend/**/*.test.tsx'
      - '!frontend/src/test/**'
      - '!frontend/src/preview/**'
      - '!frontend/preview.html'
      - '!frontend/vitest.config.ts'
      - '!frontend/AGENTS.md'
      - '!frontend/CLAUDE.md'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/deploy.yml'
  # Manual escape hatch: rebuild + redeploy from current master without a code
  # change (a base-image security fix, or a deploy that needs re-running).
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # The verdict pipeline needs sqlite3 built with loadable-extension support
      # (vectors.setup degrades to no-op otherwise, silently losing verdicts).
      # Verify the assumption on every build instead of after a deploy.
      - name: Smoke-test sqlite-vec loads in the image
        run: |
          docker run --rm "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}" \
            /app/.venv/bin/python -c 'import sqlite3, sqlite_vec; c = sqlite3.connect(":memory:"); c.enable_load_extension(True); sqlite_vec.load(c); print("sqlite-vec", c.execute("select vec_version()").fetchone()[0])'

      - name: Trigger deploy via hookploy
        run: |
          curl -fsS -X POST "${{ vars.HOOKPLOY_URL }}/hooks/condenser" \
            -H "Authorization: Bearer ${{ secrets.HOOKPLOY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"digest": "${{ steps.build.outputs.digest }}"}'
