[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "condenser-probe"
version = "0.1.0"
description = "Local probe that pushes X (Twitter) data to a condenser server"
requires-python = ">=3.11"
dependencies = [
    "apscheduler>=3.10,<4",
    "httpx>=0.27.0",
    "xbird>=1.0.0",
]

# xbird is not on PyPI. The committed source is the git remote so any checkout
# resolves to a pinned commit (uv.lock records it); to co-develop xbird locally,
# overlay an editable install instead of editing this — see the README.
[tool.uv.sources]
xbird = { git = "ssh://git@github.com/reorx/xbird", branch = "master" }

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
]

[project.scripts]
condenser-probe = "condenser_probe.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["condenser_probe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
