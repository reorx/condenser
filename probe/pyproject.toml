[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "condenser-probe"
version = "0.1.0"
description = "Local probe that pushes X (Twitter) data from the bird CLI to a condenser server"
requires-python = ">=3.10"
dependencies = [
    "apscheduler>=3.10,<4",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
]

[project.scripts]
condenser-probe = "condenser_probe.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["condenser_probe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
