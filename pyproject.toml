[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "condenser"
version = "0.1.0"
description = "Self-hosted single-user Telegram channel aggregating reader"
requires-python = ">=3.10"
dependencies = [
    "telememo>=0.1.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.2.0",
    "cryptography>=42.0.0",
    "itsdangerous>=2.1.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "metadata-parser>=1.0,<2",
    # metadata-parser 1.0 imports the stdlib `cgi` module (only in its requests-fetch
    # path, which we bypass); `cgi` was removed in Python 3.13 (PEP 594), so we provide
    # the maintained backport on 3.13+ to keep `import metadata_parser` working.
    "legacy-cgi>=2.6; python_version >= '3.13'",
    # metadata-parser prefers lxml but doesn't declare it; without it every parse
    # falls back to html.parser AND logs a false ERROR (logger `metdata_parser` —
    # upstream's typo) that polluted level-based alerting in production. Binary
    # wheels exist for linux/amd64 + macOS, so no compiler needed in the image.
    "lxml>=5.0",
    "sqlite-vec>=0.1.9",
    "feedparser>=6.0.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
condenser = "condenser.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["condenser"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# probe/ is a separate uv package with its own venv and test run (cd probe && uv run pytest);
# collecting it from here would import condenser_probe, which this env doesn't have.
testpaths = ["tests"]
