name: Condenser
options:
  bundleIdPrefix: com.reorx
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

# 第三方依赖统一在 CondenserKit/Package.swift 声明，app target 传递依赖
packages:
  CondenserKit:
    path: CondenserKit

settings:
  base:
    SWIFT_VERSION: "5.0"

targets:
  Condenser:
    type: application
    platform: iOS
    sources:
      - Condenser
    dependencies:
      - package: CondenserKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.reorx.condenser
        # iPhone only（iPad 能跑即可，不专门适配 —— 见 kb/plans v1 非目标）
        TARGETED_DEVICE_FAMILY: "1"
        # Mac Catalyst（plan 2026-09-04）：同一份代码编成 Mac app。Catalyst 从 iPad idiom
        # 派生，所以只在 macOS SDK 下把设备家族换成 iPad(2) + Mac(6)——6 = 「Optimize for
        # Mac」：控件按 AppKit 尺寸 1:1 渲染而不是 iPad 界面缩到 77%。iOS 构建不受影响，
        # 商店的 iOS 版依旧是 iPhone only（加了 2 就要交 iPad 截图）。
        SUPPORTS_MACCATALYST: YES
        "TARGETED_DEVICE_FAMILY[sdk=macosx*]": "2,6"
        # 有了 Catalyst 就不再让「Designed for iPhone」那个 iOS 二进制在 Mac 上出现
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        # 保持 com.reorx.condenser，不派生 maccatalyst.* 前缀：同一 bundle ID 在 ASC 上
        # 是同一个 app record 的 macOS 平台版本（universal purchase，买一次两端都有）
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
        # Mac App Store 强制 App Sandbox；只在 macOS SDK 下挂 entitlements，
        # iOS 的 profile 不认识 app-sandbox 这个 key
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": Condenser/Condenser-macCatalyst.entitlements
        # 模拟器工作流无需签名；真机部署时再配 DEVELOPMENT_TEAM
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        # App Store 版本号：市场版本 + 构建号（升版本改这里，make gen 重新生成）
        MARKETING_VERSION: "1.1.0"
        CURRENT_PROJECT_VERSION: "3"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Condenser/Info.plist
      properties:
        CFBundleDisplayName: Condenser
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # 只用 HTTPS/ATS 豁免内的标准加密，出口合规免申报（上传 ASC 后不再逐 build 问询）
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # 本地 dev 后端是 http://localhost，放行本地明文（不影响线上 https）
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # 详情抽屉的「分享图片」：系统分享面板里的「存储图像」需要这条声明，
        # 缺了它这一项会直接崩。只写入、从不读取相册（没有 NSPhotoLibraryUsageDescription）
        NSPhotoLibraryAddUsageDescription: 从分享面板选择「存储图像」时，需要把生成的图片写入相册。Condenser 不会读取你的照片。
        # 认证回调 condenser://auth（spec: kb/plans/2026-07-16-ios-reader-app.md）
        CFBundleURLTypes:
          - CFBundleURLName: com.reorx.condenser.auth
            CFBundleURLSchemes:
              - condenser
